syntax = "proto3";

package interview;

service InterviewService {
  rpc CreateInterview (CreateInterviewRequest) returns (Interview);
  rpc GetInterviewByApplication (GetInterviewByApplicationRequest) returns (GetInterviewByApplicationResponse);
}

message CreateInterviewRequest {
  string applicationId = 1;
  string userId = 2;
  string scheduledAt = 3;
}

message GetInterviewByApplicationRequest {
  string applicationId = 1;
  string userId = 2;
}

message Feedback {
  string id = 1;
  optional string interviewer = 2;
  optional int32 rating = 3;
  optional string comments = 4;
}

message InterviewRound {
  string id = 1;
  int32 roundNumber = 2;
  string type = 3;
  string status = 4;
  optional string scheduledAt = 5;
  repeated Feedback feedback = 6;
}

message Interview {
  string id = 1;
  string applicationId = 2;
  string status = 3;
  optional string scheduledAt = 4;
  string createdAt = 5;
  repeated InterviewRound rounds = 6;
}

message GetInterviewByApplicationResponse {
  repeated Interview interviews = 1;
}